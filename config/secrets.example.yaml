# secrets.example.yaml — API 密钥模板
# 复制为 config/secrets.yaml 并填入真实密钥:
#   cp config/secrets.example.yaml config/secrets.yaml
# 该文件已被 .gitignore 排除,不会提交到仓库。
# 优先级: models.yaml 中显式写的 api_key > 本文件 > 环境变量(api_key_env)。

providers:
  deepseek:
    api_key: ""          # 例: sk-xxxxxxxx
  moonshot:
    api_key: ""
  zhipu:
    api_key: ""
  openai:
    api_key: ""
  anthropic:
    api_key: ""
  ollama:
    api_key: ""          # 本地模型通常无需密钥,留空即可

search:
  tavily:
    api_key: ""          # 例: tvly-xxxxxxxx
  bocha:
    api_key: ""
