# Quality assessment rules (v3 Phase 5)
# 八维质量评估的维度权重(会归一化到 1.0)。默认等权;按需调整,例如:
#   cross_validation_rate: 0.20   # 更看重交叉验证
#   debate_balance: 0.05          # 弱化平衡性

dimension_weights:
  evidence_quality: 0.125        # 证据质量
  reasoning_depth: 0.125         # 推理深度
  argument_diversity: 0.125      # 论点多样性
  rebuttal_effectiveness: 0.125  # 反驳有效性
  judge_rigor: 0.125             # 裁判严谨性
  cross_validation_rate: 0.125   # 交叉验证率
  debate_balance: 0.125          # 辩论平衡性
  conclusion_reliability: 0.125  # 结论可靠性
